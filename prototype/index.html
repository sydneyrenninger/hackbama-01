<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bama Buy</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#9E1B32;--a:#E8E8E8;--bg:#f7f4f1;--card:#fff;--tx:#1a1620;--mut:#8a8494;--ln:#ece7e3;--r:22px}
@media(prefers-color-scheme:dark){:root{--bg:#0f0d13;--card:#1a1720;--tx:#f5f2f7;--mut:#9a93a6;--ln:#2a2632}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 0% 0%,color-mix(in srgb,var(--p) 22%,transparent),transparent),radial-gradient(500px 400px at 100% 100%,color-mix(in srgb,var(--a) 30%,transparent),transparent)}
#app{max-width:1040px;margin:0 auto;padding:16px 16px 110px}
button{font:inherit;font-weight:600;cursor:pointer;border:0;background:var(--card);color:var(--tx);border-radius:999px;padding:10px 16px;box-shadow:0 1px 0 var(--ln) inset,0 0 0 1px var(--ln);transition:.15s}
button:active{transform:scale(.96)}
button.pri,button.on{background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 72%,var(--a)));color:#fff;box-shadow:0 8px 20px -8px var(--p)}
button.g{background:none;box-shadow:none;color:var(--p);padding:6px}
input,select,textarea{font:inherit;width:100%;padding:13px 16px;border:1.5px solid var(--ln);border-radius:16px;background:var(--card);color:var(--tx);outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
.logo{font-weight:800;font-size:26px;letter-spacing:-1px;background:linear-gradient(135deg,var(--p),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:16px}.bar .sp{flex:1}
.bar select{width:auto;border-radius:999px;padding:9px 14px;font-weight:600}
h2{font-size:28px;letter-spacing:-1px;margin:6px 0 14px}h3{margin:0 0 8px}
.auth{max-width:380px;margin:7vh auto 0;background:var(--card);border-radius:32px;padding:32px 26px;display:grid;gap:12px;text-align:center;box-shadow:0 30px 60px -30px color-mix(in srgb,var(--p) 50%,transparent),0 0 0 1px var(--ln)}
.av{width:72px;height:72px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:30px;color:#fff;background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 70%,var(--a)))}
.err{color:#e0334c;font-size:13px;min-height:18px}.mut{color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.row>input{flex:1;min-width:140px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}.chips button{white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{position:relative;border-radius:var(--r);overflow:hidden;cursor:pointer;aspect-ratio:4/5;background:#222;color:#fff;box-shadow:0 14px 30px -18px #000}
.tile.reel{aspect-ratio:3/4.6}.tile:hover{transform:translateY(-3px)}
.m{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:grid;place-items:center;font-size:64px}
.sh{position:absolute;inset:0;background:linear-gradient(transparent 45%,#000b)}
.tt{position:absolute;left:12px;right:12px;bottom:12px}.tt b{display:block;font-size:15px}
.pill{position:absolute;top:10px;left:10px;background:#0007;backdrop-filter:blur(8px);color:#fff;border-radius:999px;font-size:11px;padding:4px 10px;font-weight:600}
.pr{position:absolute;top:10px;right:10px;background:#fff;color:#111;border-radius:999px;font-weight:800;padding:4px 11px;font-size:13px}
.tag{display:inline-block;font-size:12px;background:color-mix(in srgb,var(--p) 14%,var(--card));color:var(--p);border-radius:999px;padding:3px 10px;margin:3px 4px 0 0;font-weight:600}
.tile .tag{background:#fff3;color:#fff}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 0 0 1px var(--ln)}
.nav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(18px);box-shadow:0 20px 40px -12px #0006,0 0 0 1px var(--ln);z-index:20}
.nav button{background:none;box-shadow:none;padding:10px 16px;color:var(--mut)}.nav button.on{color:#fff;background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 55%,#000))}
.feed{height:calc(100vh - 100px);max-width:420px;margin:0 auto;overflow-y:scroll;scroll-snap-type:y mandatory;border-radius:30px;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}
.reelv{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#111;color:#fff;overflow:hidden}
.info{position:absolute;left:16px;right:84px;bottom:22px}.info .t{font-size:20px;font-weight:800;letter-spacing:-.5px}
.act{position:absolute;right:12px;bottom:26px;display:grid;gap:14px;justify-items:center}
.act button{width:52px;height:52px;padding:0;border-radius:50%;background:#fff2;backdrop-filter:blur(10px);color:#fff;font-size:20px;box-shadow:0 0 0 1px #fff3}
.act small{display:block;font-size:10px;font-weight:600;margin-top:-4px}
.back{position:fixed;top:14px;left:14px;z-index:30;background:#000a;color:#fff}
.drop{display:grid;place-items:center;aspect-ratio:16/10;border:2px dashed var(--ln);border-radius:var(--r);cursor:pointer;overflow:hidden;position:relative;color:var(--mut);text-align:center}
.drop img,.drop video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.form{display:grid;gap:10px;max-width:520px;margin:auto}
.chat{display:grid;gap:8px;padding:8px 0;min-height:45vh;align-content:start}
.b{max-width:78%;padding:10px 14px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--ln)}.b.me{justify-self:end;background:var(--p);color:#fff;box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stats div{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 0 0 1px var(--ln)}.stats b{font-size:24px;display:block;letter-spacing:-1px}
.th{display:flex;gap:12px;align-items:center;cursor:pointer}.th .av{width:46px;height:46px;font-size:18px;margin:0}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:999px;z-index:50;font-weight:600}
.sold{filter:grayscale(.8)}
body{letter-spacing:-.1px}
#app{max-width:1120px;padding:24px 22px 120px}
button{box-shadow:0 1px 2px #1a162010,0 0 0 1px var(--ln);font-weight:700}
button:hover{transform:translateY(-1px);box-shadow:0 6px 16px #1a162018,0 0 0 1px var(--ln)}
button.pri:hover,button.on:hover{box-shadow:0 10px 24px -8px var(--p)}
input,select,textarea{border-radius:14px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 14%,transparent)}
h2{font-size:clamp(26px,4vw,34px);margin:16px 0 20px}
.card,.stats div,.auth{box-shadow:0 12px 32px -24px #15101c45,0 0 0 1px var(--ln)}
.card{padding:20px}
.grid{gap:18px}
.tile{transition:transform .18s,box-shadow .18s}
.tile:hover{box-shadow:0 18px 34px -18px #0008}
.form{gap:14px}
.form>h2{margin:4px 0 8px}
.field-label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:2px 0 -7px}
.price-field{display:flex;align-items:center;gap:6px;padding:0 14px;border:1.5px solid var(--ln);border-radius:14px;background:var(--card);color:var(--mut);font-weight:700}
.price-field:focus-within{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 14%,transparent)}
.price-field input{min-width:0;border:0;box-shadow:none;padding-left:2px;padding-right:2px}
.price-field input:focus{box-shadow:none}
.price-range{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.trade-option{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--ln);border-radius:16px;background:color-mix(in srgb,var(--p) 4%,var(--card));cursor:pointer}
.trade-option input{width:18px;height:18px;accent-color:var(--p);flex:none;margin:0}
.trade-option span{display:grid;gap:3px}
.trade-option small{color:var(--mut);font-size:12px}
.trade-fields,.edit-post{display:grid;gap:12px;padding:16px;border:1px solid var(--ln);border-radius:18px;background:color-mix(in srgb,var(--card) 88%,var(--bg))}
.edit-post h3{margin:0 0 3px}
.search-panel{max-width:760px;padding:16px 18px 8px;border:1px solid var(--ln);border-radius:20px;background:var(--card);box-shadow:0 8px 24px -20px #15101c60}

.bar select{max-width:min(54vw,300px);overflow:hidden;text-overflow:ellipsis}
.nav{max-width:calc(100vw - 24px);overflow-x:auto}
.nav button{white-space:nowrap}
.tt [data-preview-desc]{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;opacity:.82}
.drop{background:color-mix(in srgb,var(--card) 78%,var(--bg));transition:border-color .15s,color .15s}
.drop:hover{border-color:var(--p);color:var(--p)}
.post-kind{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop-label{position:absolute;left:10px;right:10px;bottom:10px;z-index:1;padding:7px 10px;border-radius:999px;background:#0009;color:#fff;font-size:12px}
.social-card{width:min(100%,460px);margin:0 auto;overflow:hidden;border:1px solid var(--ln);border-radius:18px;background:var(--card);box-shadow:0 18px 44px -30px #15101c80,0 0 0 1px var(--ln)}
.social-head{display:flex;align-items:center;gap:10px;padding:13px 15px}
.social-head>div:nth-child(2){display:grid;gap:2px}
.social-head small{font-size:11px;color:var(--mut)}
.social-avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--a));color:#fff;font-weight:800}
.social-kind{margin-left:auto;padding:5px 9px;border-radius:999px;background:color-mix(in srgb,var(--p) 10%,var(--card));color:var(--p);font-size:10px;font-weight:800;letter-spacing:.08em}
.social-media{position:relative;aspect-ratio:1/1;background:color-mix(in srgb,var(--a) 22%,#111)}
.social-media .m{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.social-actions{display:flex;align-items:center;gap:15px;padding:10px 14px 2px;font-size:23px;line-height:1}
.social-actions button{padding:0;background:none;border:0;border-radius:0;box-shadow:none;color:var(--tx);font-size:26px;line-height:1}
.social-actions button:hover{transform:scale(1.12);box-shadow:none}
.social-actions .liked,.social-actions button:first-child{color:var(--p)}
.social-spacer{flex:1}
.social-caption{padding:4px 14px 15px;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.social-price{margin-top:7px;color:var(--p);font-weight:800}
.social-like-count{margin-top:5px;font-weight:700;font-size:12px}
.social-caption .tag{margin-top:7px}
.edit-post>.mut{font-size:13px;margin:-8px 0 2px}
.tag{background:color-mix(in srgb,var(--p) 12%,var(--card));color:var(--p)}
.nav button.on{color:#fff;background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 72%,var(--a)))}
.nav button:not(.on):hover{color:var(--p);background:color-mix(in srgb,var(--a) 16%,transparent)}
.bar select{border-color:color-mix(in srgb,var(--p) 18%,var(--ln))}
.drop{border-color:color-mix(in srgb,var(--p) 25%,var(--ln))}
.trade-option{border-color:color-mix(in srgb,var(--p) 20%,var(--ln))}
.social-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#111}
.post-kind button:not(.on){background:color-mix(in srgb,var(--a) 18%,var(--card));box-shadow:0 0 0 1px color-mix(in srgb,var(--p) 18%,var(--ln))}
.social-actions span:first-child{color:var(--p)}
.toast{border-top:3px solid var(--a)}
.product-detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.9fr);gap:28px;align-items:start;max-width:940px;margin:20px auto;padding:22px;background:var(--card);border:1px solid var(--ln);border-radius:var(--r);box-shadow:0 18px 44px -32px #15101c80}
.product-visual{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:18px;background:color-mix(in srgb,var(--a) 20%,var(--bg))}
.product-visual .m,.product-visual video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.product-info{display:grid;gap:12px;align-content:start;padding:8px 0}
.product-info h2{margin:0}
.product-price{font-size:30px;font-weight:800;color:var(--p)}
.product-description{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.product-tags{display:flex;flex-wrap:wrap;gap:3px}
.product-info .row{margin:4px 0 0}
.product-info .social-like{color:var(--p);font-size:22px}
